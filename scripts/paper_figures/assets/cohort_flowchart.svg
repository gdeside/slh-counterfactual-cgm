<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #002B49; stroke-width: 1.75; rx: 4px; ry: 4px; }
      .box-highlight { fill: #f0f4f8; stroke: #002B49; stroke-width: 1.75; rx: 4px; ry: 4px; }
      .excl-box { fill: #ffffff; stroke: #6c757d; stroke-width: 1.75; rx: 4px; ry: 4px; }
      .text-navy { fill: #002B49; font-size: 13px; font-weight: normal; text-anchor: middle; }
      .text-bold { font-weight: bold; }
      .text-grey { fill: #555555; font-size: 13px; text-anchor: start; }
      .arrow { stroke: #002B49; stroke-width: 1.75; fill: none; marker-end: url(#arrowhead-navy); }
      .excl-arrow { stroke: #6c757d; stroke-width: 1.75; fill: none; marker-end: url(#arrowhead-grey); }
    </style>
    
    <marker id="arrowhead-navy" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#002B49" />
    </marker>
    <marker id="arrowhead-grey" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#6c757d" />
    </marker>
  </defs>

  <!-- Main Column Boxes -->
  <!-- Box 1 -->
  <rect x="30" y="20" width="270" height="52" class="box" />
  <text x="165" y="41" class="text-navy">Patients in diabetes pediatric</text>
  <text x="165" y="56" class="text-navy">convention at CUSL</text>
  <text x="165" y="70" class="text-navy text-bold">N = 366</text>

  <!-- Box 2 -->
  <rect x="30" y="122" width="270" height="52" class="box" />
  <text x="165" y="145" class="text-navy">Patients assessed for eligibility</text>
  <text x="165" y="165" class="text-navy text-bold">N = 245</text>

  <!-- Box 3 -->
  <rect x="30" y="224" width="270" height="52" class="box" />
  <text x="165" y="245" class="text-navy">Patients with CGM sampled</text>
  <text x="165" y="260" class="text-navy">at 5-min intervals</text>
  <text x="165" y="274" class="text-navy text-bold">N = 219</text>

  <!-- Box 4 -->
  <rect x="30" y="326" width="270" height="52" class="box" />
  <text x="165" y="345" class="text-navy">Patients with ≥1 valid 45-day window</text>
  <text x="165" y="360" class="text-navy">and ≥70% data coverage</text>
  <text x="165" y="374" class="text-navy text-bold">N = 216</text>

  <!-- Box 5 (Highlighted) -->
  <rect x="30" y="428" width="270" height="52" class="box-highlight" />
  <text x="165" y="451" class="text-navy">Patients included in analysis</text>
  <text x="165" y="471" class="text-navy text-bold">N = 135</text>

  <!-- Vertical Arrows -->
  <line x1="165" y1="72" x2="165" y2="120" class="arrow" />
  <line x1="165" y1="174" x2="165" y2="222" class="arrow" />
  <line x1="165" y1="276" x2="165" y2="324" class="arrow" />
  <line x1="165" y1="378" x2="165" y2="426" class="arrow" />

  <!-- Exclusion Boxes -->
  <!-- Excl 1 -->
  <rect x="380" y="68" width="260" height="58" class="excl-box" />
  <text x="392" y="88" class="text-grey"><tspan class="text-bold">Excluded</tspan> - were not under Freestyle</text>
  <text x="392" y="104" class="text-grey">Libre (Abbott), or did not have</text>
  <text x="392" y="120" class="text-grey">≥3 months of CGM data <tspan dx="5">(n = 121)</tspan></text>

  <!-- Excl 2 -->
  <rect x="380" y="172" width="260" height="52" class="excl-box" />
  <text x="392" y="194" class="text-grey"><tspan class="text-bold">Excluded</tspan> - CGM sampled at</text>
  <text x="392" y="210" class="text-grey">15-min intervals <tspan dx="5">(n = 26)</tspan></text>

  <!-- Excl 3 -->
  <rect x="380" y="271" width="260" height="52" class="excl-box" />
  <text x="392" y="293" class="text-grey"><tspan class="text-bold">Excluded</tspan> - no 45-day window with</text>
  <text x="392" y="309" class="text-grey">≥70% CGM coverage <tspan dx="5">(n = 3)</tspan></text>

  <!-- Excl 4 -->
  <rect x="380" y="373" width="260" height="52" class="excl-box" />
  <text x="392" y="395" class="text-grey"><tspan class="text-bold">Excluded</tspan> - median glucose outside</text>
  <text x="392" y="411" class="text-grey">6.1-9.4 mmol/L <tspan dx="5">(n = 81)</tspan></text>

  <!-- Exclusion Horizontal Arrows -->
  <line x1="165" y1="96" x2="378" y2="96" class="excl-arrow" />
  <line x1="165" y1="198" x2="378" y2="198" class="excl-arrow" />
  <line x1="165" y1="300" x2="378" y2="300" class="excl-arrow" />
  <line x1="165" y1="402" x2="378" y2="402" class="excl-arrow" />
</svg>
